<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/static/images/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="图书馆 - 山河大学：提供文库资料、文章资讯的在线阅读与下载服务。" />
    <!-- Open Graph -->
    <meta property="og:site_name" content="图书馆 - 山河大学" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="图书馆 - 山河大学" />
    <meta property="og:description" content="图书馆 - 山河大学：提供文库资料、文章资讯的在线阅读与下载服务。" />
    <meta
      property="og:image"
      content="/static/images/logo.png"
    />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="图书馆 - 山河大学" />
    <meta name="twitter:description" content="图书馆 - 山河大学：提供文库资料、文章资讯的在线阅读与下载服务。" />
    <meta name="twitter:image" content="/static/images/logo.png" />
    <title>图书馆 - 山河大学</title>
    <!-- 首屏骨架：脚本执行前先有可见内容，避免白屏；Vue 挂载时会整体替换 #app 的内容 -->
    <style>
      #app {
        min-height: 100vh;
      }
      .boot-skeleton {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #909399;
      }
      .boot-skeleton::after {
        content: '';
        width: 18px;
        height: 18px;
        margin-left: 10px;
        border: 2px solid #dcdfe6;
        border-top-color: #2f7cf6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-skeleton">正在加载…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
